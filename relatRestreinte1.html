<html>
<body style="background-color:grey">
<center>
<canvas id="canvas" width=800 height=600 ></canvas>
<br/>Prise en compte du retard visuel : 
<input type=checkbox value=unchecked onchange="AvecRetardLumiere=!this.checked" />
</center>
<script>

/*
x'= g(x-vt)
t'=g(t-xv/c²)    -->constance de t-xv/c² 
*/
let canvas=document.getElementById("canvas")
let ctx=canvas.getContext("2d")
let W=800
let H=600
const zoom=30
let AvecRetardLumiere=false

let bgcolor="#505050"

function eff(){
	ctx.fillStyle="black"
	ctx.fillRect(0, 0, W, H);
	
}
ctx.strokestyle="white"
function line(x,y,x2,y2){
	ctx.beginPath()
	ctx.moveTo(W/2+x*zoom,H/2-y*zoom)
	ctx.lineTo(W/2+x2*zoom,H/2-y2*zoom)
	ctx.stroke()
}
function dot(x,y,col="white"){
	ctx.beginPath()
	ctx.arc(x*zoom+ W/2, H/2-zoom*y, zoom/10, 0, Math.PI*2) 
	ctx.fillStyle=col
	ctx.fill()
}
class V{
	constructor(x,y){this.x=x;this.y=y}
	plus(b){return new V(b.x+this.x,b.y+this.y)}
	moins(b){return new V(-b.x+this.x,-b.y+this.y)}
	sc(v){return v.x*this.x+v.y*this.y}
	scal(v){return this.sc(v)}
	f(n){return new V(n*this.x, this.y*n)}
	u(){return this.f(1/Math.sqrt(this.sc(this)))}
	n2(){return this.sc(this)}
}
function gamma(v){
	return 1/Math.sqrt(1-v.scal(v))
}
class Line{
	static list=[]
	constructor(vie, col="white", putinlist=true){//vie: fonction de t_origine, a, b: bornes
		this.vie=vie
		this.col=col;
		if (putinlist) Line.list.push(this)
	}
	solveT(v, pos, t_O){//v: ma vitesse pour O, pos, t_O:temps pour 0
	//dichotomie
	//je veux trouver t-xv/c²=0 relatif à cur
		let goup;
		if(AvecRetardLumiere) goup=t=>(t-t_O - this.vie(t).moins(pos).sc(v) < 0)
		else goup=t=>((t-t_O)**2 < this.vie(t).moins(pos).n2())
		
		let inut=1;
		let a,b;
		if(goup(t_O)){
			while(goup(t_O+inut)) inut*=2
			//entre 0 et inut
			a=0;
			b=inut
		}else{
			while(!goup(t_O-inut)) inut*=2
			//entre 0 et -inut
			a=-inut;
			b=0
		}
		while(b-a>0.00005){
			let m=(b+a)/2
			if(goup(t_O+m)) a=m
			else b=m
		}
		return t_O+(a+b)/2   // temps pour O de l'evenement percu par M
	}
	getX(v,pos,t_O){
		let t=this.solveT(v,pos,t_O)
		let inu=this.vie(t).moins(pos)
		if(v.sc(v)==0) return inu
		let p=v.f(inu.sc(v)/v.n2())
		return p.f(1/g).plus(inu.moins(p))
	}
}
function actuvit(){
	let amp=0.08
	if(kp.ArrowRight)vit.x+=amp
	if(kp.ArrowLeft)vit.x-=amp
	if(kp.ArrowUp)vit.y+=amp
	if(kp.ArrowDown)vit.y-=amp
	if(vit.sc(vit)>0.95) vit=vit.u().f(Math.sqrt(0.95))
}
const log= console.log;
const axes={z:-1, ex:-1, ey:-1}
function affall(){
	W  = window.innerWidth;
  	H = window.innerHeight-100;
	if(H!=ctx.canvas.height)ctx.canvas.height=H
	if(W!=ctx.canvas.width)ctx.canvas.width=W
	
	eff()
	
	let ex=axes.ex.getX(vit, pos, t_O)
	let ey=axes.ey.getX(vit, pos, t_O)
	let z=axes.z.getX(vit, pos, t_O)
	ctx.strokeStyle=bgcolor
	for(let x=-20;x<20;x+=2){
		let a=z.plus(ex.moins(z).f(x)).plus(ey.moins(z).f(20))
		let b=z.plus(ex.moins(z).f(x)).plus(ey.moins(z).f(-20))
		
		line(a.x,a.y,b.x,b.y)		
	}
	for(let y=-20;y<20;y+=2){
		let a=z.plus(ex.moins(z).f(20)).plus(ey.moins(z).f(y))
		let b=z.plus(ex.moins(z).f(-20)).plus(ey.moins(z).f(y))
		line(a.x,a.y,b.x,b.y)		
	}
	
	
	
	for(let i of Line.list){
		let see=i.getX(vit,pos,t_O)
		if(i.col!=-1)dot(see.x, see.y,i.col)
	}
	
	
	ctx.strokeStyle="lightgreen"
	line(0,1,0,-1)
	line(1,0,-1,0)
	ctx.strokeStyle="white"
}
function genereLines(){
	//origine
	
	
	let static=pos=>(t=>pos)
	
	let u= t=>new V(Math.cos(t),Math.sin(t))
	let tourne=(r,theta)=>(t=>u(t/3-theta).f(r))
	
	for(let x=-10;x<11;x+=2){ // grille d'horloges
		for(let y=-10;y<11;y+=2){
			new Line((t=>new V(x, y).plus(u(t).f(0.5))), ctx.strokeStyle=bgcolor) // vitesses c/2
		}
	}
	
	for(let r=0.2;r<3;r+=0.2){
		new Line(tourne(r,0),"red")
		new Line(tourne(r,2*Math.PI/5),"lightblue")
		new Line(tourne(r,-2*Math.PI/5),"lightgreen")
		new Line(tourne(r,4*Math.PI/5),"yellow")
		new Line(tourne(r,-4*Math.PI/5),"pink")
	}
	//light
	let rebond= (p,u,r) => (t=>(t%(2*r)<r)?p.plus(u.f(t%r)):p.plus(u.f(r)).moins(u.f(t%r)))
	
	for(let i=0;i<5;i+=0.1)
		new Line(rebond(new V(7+i, -2-2*i), new V(2,1).u(), 10))
		
	for(let i=0;i<30;i++){
		new Line(rebond(new V(0,7), u(i/30*2*Math.PI), 10), "red")
	}
	
	axes.z=new Line(static(new V(0,0)),-1, false)// axes de base
	axes.ex=new Line(static(new V(1,0)),-1, false);
	axes.ey=new Line(static(new V(0,1)),-1, false);
	
	

}
const dt=0.1
const c=1//
let pos=new V(0,0) /////////position relative à l'origine
let vit=new V(0.4,0)/////dans le ref origine

eff()
let kp={}
document.onkeydown=e=>{kp[e.key]=true;if(e.key=="a")vit=new V(0,0);return (e.key=='x' && (go=(!go)))?main():0}
document.onkeyup=e=>{kp[e.key]=false}

genereLines()

let go=0
let t_O=0;
let g=1;
let tM=0;

function main(){
	actuvit()
	g=gamma(vit)
	
	const curdt=dt*g
	tM+=dt
	t_O+=curdt //////// temps actuel selon O
	pos=pos.plus(vit.f(curdt))


	affall()

	//resize canvas
	
  	
	if(!go) return
	window.requestAnimationFrame(main)
}

</script>
</body>
</html>
